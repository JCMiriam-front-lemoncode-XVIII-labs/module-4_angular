<section class="gallery" aria-labelledby="gallery-title">
  <header>
    <h1 id="gallery-title">Galería</h1>
    <p>Selecciona una imagen o usa los controles para recorrer la colección.</p>
  </header>

  <div class="gallery__viewer">
    <img [src]="selectedImage.src" [alt]="selectedImage.title" [style.width.%]="imageSize" />
    <p>{{ selectedImage.title }}</p>
  </div>

  <div class="gallery__controls" aria-label="Controles de la galería">
    <button mat-stroked-button type="button" [disabled]="selectedIndex === 0" (click)="previous()">
      <mat-icon aria-hidden="true">navigate_before</mat-icon>
      Anterior
    </button>
    <button mat-stroked-button type="button" [disabled]="selectedIndex === images.length - 1" (click)="next()">
      Siguiente
      <mat-icon aria-hidden="true">navigate_next</mat-icon>
    </button>
    <button mat-stroked-button type="button" (click)="increaseSize()">
      <mat-icon aria-hidden="true">zoom_in</mat-icon>
      Aumentar
    </button>
    <button mat-stroked-button type="button" (click)="decreaseSize()">
      <mat-icon aria-hidden="true">zoom_out</mat-icon>
      Disminuir
    </button>

    @if (isPlaying) {
      <button mat-flat-button type="button" (click)="stop()">
        <mat-icon aria-hidden="true">stop</mat-icon>
        Stop
      </button>
    } @else {
      <button mat-flat-button type="button" (click)="play()">
        <mat-icon aria-hidden="true">play_arrow</mat-icon>
        Play
      </button>
    }
  </div>

  <div class="gallery__pagination" aria-label="Paginación del listado de imágenes">
    <button mat-stroked-button type="button" [disabled]="currentPage === 0" (click)="previousPage()">
      Página anterior
    </button>
    <span>Página {{ currentPage + 1 }} de {{ totalPages }}</span>
    <button
      mat-stroked-button
      type="button"
      [disabled]="currentPage === totalPages - 1"
      (click)="nextPage()"
    >
      Página siguiente
    </button>
  </div>

  <div class="gallery__thumbnails" aria-label="Listado de imágenes">
    @for (image of images | slice: pageStart : pageEnd; track image.id; let imageIndex = $index) {
      <button
        type="button"
        class="gallery__thumbnail"
        [class.gallery__thumbnail--selected]="pageStart + imageIndex === selectedIndex"
        [attr.aria-label]="'Seleccionar ' + image.title"
        [attr.aria-pressed]="pageStart + imageIndex === selectedIndex"
        (click)="selectImage(pageStart + imageIndex)"
      >
        <img [src]="image.src" [alt]="image.title" />
      </button>
    }
  </div>
</section>
